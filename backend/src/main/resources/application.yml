spring:
  application:
    name: civictrace
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5435/civictrace}
    username: ${SPRING_DATASOURCE_USERNAME:civictrace}
    password: ${SPRING_DATASOURCE_PASSWORD}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    baseline-on-migrate: false
  session:
    jdbc:
      initialize-schema: never
  jackson:
    time-zone: UTC

server:
  port: ${SERVER_PORT:8080}
  forward-headers-strategy: framework
  servlet:
    session:
      cookie:
        http-only: true
        secure: ${SESSION_COOKIE_SECURE:false}
        same-site: ${SESSION_COOKIE_SAME_SITE:lax}
        name: CIVICTRACE_SESSION

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

app:
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173}
  seed-demo: ${APP_SEED_DEMO:false}
  demo-staff-email: ${DEMO_STAFF_EMAIL:}
  demo-staff-password: ${DEMO_STAFF_PASSWORD:}
  demo-resident-email: ${DEMO_RESIDENT_EMAIL:resident@civictrace.local}
  demo-resident-password: ${DEMO_RESIDENT_PASSWORD:}
