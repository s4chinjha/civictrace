services:
  db:
    image: postgres:16-alpine
    container_name: civictrace-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-civictrace}
      POSTGRES_USER: ${POSTGRES_USER:-civictrace}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Copy .env.example to .env and set POSTGRES_PASSWORD}
    ports:
      - "${POSTGRES_PORT:-5435}:5432"
    volumes:
      - civictrace-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  civictrace-postgres-data:
